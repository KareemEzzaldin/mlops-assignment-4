name: ML Model CI

on:
  push:
    # This ensures it runs on every branch EXCEPT main
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Linter Check
        run: |
          # This checks for syntax errors
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Model Dry Test
        run: |
          python -c "import torch; print('Model environment ready!')"

      - name: Train Model and Generate Image
        run: python main.py      

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project-outputs
          path: |
            README.md
            generated_sample.png
